<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    :root {
      --paper: #f6f7f9;
      --ink: #1d2733;
      --muted: #5e6b7a;
      --line: #cfd6de;
      --accent: #2b5c8a;
      --warn-bg: #fff5e0;
      --warn-line: #b7791f;
      --warn-ink: #5c3b00;
    }
    * { box-sizing: border-box; }
    body {
      max-width: 42rem; margin: 2.5rem auto; padding: 0 1rem;
      background: var(--paper); color: var(--ink);
      font: 1rem/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.6rem; font-weight: 600; letter-spacing: -.01em; }
    label { display: block; font-weight: 600; }
    .hint { margin: .15rem 0 .5rem; color: var(--muted); font-size: .9rem; }
    textarea {
      display: block; width: 100%; padding: .6rem .7rem;
      border: 1px solid var(--line); border-radius: 4px; background: #fff;
      color: inherit; font: inherit; resize: vertical;
    }
    button {
      margin-top: .75rem; padding: .5rem 1.1rem; border: 0; border-radius: 4px;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: progress; }
    :focus-visible { outline: 3px solid #7fa7cf; outline-offset: 2px; }

    #panel { margin-top: 2rem; }
    #notice {
      margin: 0; padding: .75rem 1rem; border-left: 4px solid var(--line);
      background: #fff; color: var(--muted);
    }
    #panel[data-state="manual_review"] #notice,
    #panel[data-state="invalid_input"] #notice {
      border-left-color: var(--warn-line); background: var(--warn-bg); color: var(--warn-ink);
    }
    #result { padding: 1rem; border-left: 4px solid var(--accent); background: #fff; }
    #result dl { margin: 0 0 1rem; }
    #result dt { color: var(--muted); font-size: .9rem; }
    #result dd { margin: 0; font-size: 1.15rem; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form novalidate>
    <label for="message">Текст заявки</label>
    <p class="hint" id="message-hint">Вставьте сообщение клиента — сервис предложит тему и черновик ответа.</p>
    <textarea id="message" rows="5" aria-describedby="message-hint"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <section id="panel" data-state="empty" aria-live="polite">
    <p id="notice" hidden></p>
    <div id="result" hidden>
      <dl>
        <dt>Тема</dt>
        <dd id="topic"></dd>
      </dl>
      <label for="draft">Черновик ответа</label>
      <p class="hint">Проверьте и при необходимости исправьте перед отправкой клиенту.</p>
      <textarea id="draft" rows="5"></textarea>
    </div>
  </section>

  <script type="module" src="/app.mjs"></script>
</body>
</html>
